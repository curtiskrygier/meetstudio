<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Live Concierge — Main Stage</title>
  <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
  <style>
    :root {
      --active-font-size: 32px;
      --prev-font-size: 24px;
      --older-font-size: 18px;
      --transition-timing: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-duration: 400ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Google Sans', 'Plus Jakarta Sans', sans-serif;
      background: #0c0d10;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
      z-index: 100;
    }
    .topbar-title { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); flex: 1; }

    /* Content Area */
    #content-layer {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* Constrain to 16:9 but allow it to shrink to fit the screen bounds */
      width: 100%;
      max-width: calc((100vh - 200px) * (16 / 9)); 
      max-height: calc(100vh - 200px);
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      background: #0c0d10;
    }

    /* Document View */
    .doc-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 48px;
      text-align: center;
      max-width: 560px;
      width: 90%;
      z-index: 10;
    }
    .doc-btn {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      margin-top: 24px;
    }

    /* Diagram View */
    .diagram-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    #diagram-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #diagram-container svg {
      /* Force the raw SVG to respect the flex container bounds */
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    /* Internal Placeholder (for listening state) */
    .inner-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      color: rgba(255,255,255,0.4);
    }
    .ear-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(155,109,255,0.1);
      border: 1px solid rgba(155,109,255,0.2);
      display: grid; place-items: center;
      color: #9B6DFF;
    }

    /* Placeholder / Waiting */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      color: rgba(255,255,255,0.5);
    }
    .pulse-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(155,109,255,0.15);
      display: grid; place-items: center;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }

    /* Transcript Layer (Permanent Overlay) */
    #transcript-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 30px;
      z-index: 200;
    }

    #transcript-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 1000px;
      gap: 12px;
    }

    .turn {
      padding: 12px 24px;
      border-radius: 12px;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 242, 255, 0.3);
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      word-wrap: break-word;
      animation: slideUp 0.3s ease-out forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .turn.active { font-size: var(--active-font-size); font-weight: 500; }
    .turn.agent { border-color: rgba(0, 242, 255, 0.5); }
    .turn.prev-1 { font-size: var(--prev-font-size); opacity: 0.6; transform: scale(0.92); animation: none; }
    .turn.prev-2, .turn.old { display: none !important; }

    .role-label { 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 0.12em; 
      margin-bottom: 4px; 
      display: block; 
      color: #00f2ff;
      font-weight: 700;
    }
    
    .content {
      text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-title" id="stage-title">Meet Live Concierge</span>
    <div id="status-badge" style="font-size:11px; opacity:0.4">Ready</div>
  </div>

  <div id="content-layer">
    <!-- View 1: Placeholder -->
    <div id="view-placeholder" class="placeholder">
      <div class="pulse-icon">✨</div>
      <p>Awaiting activity from the Side Panel...</p>
    </div>

    <!-- View 2: Document Card -->
    <div id="view-doc" class="doc-card hidden">
      <h1 id="doc-title" style="font-size:24px; margin-bottom:12px">Document Ready</h1>
      <p style="color:rgba(255,255,255,0.6); line-height:1.5; margin-bottom:16px">Your Concierge has prepared a new file for this meeting.</p>
      <div id="doc-preview" class="hidden" style="text-align:left; font-size:14px; color:rgba(255,255,255,0.8); background:rgba(0,0,0,0.25); padding:20px; border-radius:12px; margin-bottom:24px; max-height:400px; overflow-y:auto; border:1px solid rgba(255,255,255,0.1); white-space:pre-wrap; font-family:'Roboto Mono', monospace;">
      </div>
      <a id="doc-link" href="#" target="_blank" class="doc-btn">Open Full Document</a>
    </div>

    <!-- View 3: Diagram -->
    <div id="view-diagram" class="diagram-wrap hidden">
      <div id="diagram-container"></div>
    </div>
  </div>

  <!-- Permanent Transcript Layer -->
  <div id="transcript-layer">
    <div id="transcript-container"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    let currentMode = params.get('mode') || 'placeholder';
    let diagramId = params.get('diag_id') || '';
    const meetingId = params.get('meeting') || '';
    const ticket = params.get('ticket') || '';
    let knownVersion = 0;
    let turns = [];

    function showDiagramPlaceholder() {
      document.getElementById('diagram-container').innerHTML = `
        <div class="inner-placeholder">
          <div class="ear-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:28px;height:28px">
              <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            </svg>
          </div>
          <div>
            <div style="font-weight:600; color:rgba(255,255,255,0.8); margin-bottom:4px">Waiting for Architecture Description</div>
            <div style="font-size:12px">Describe your architecture to generate a new diagram</div>
          </div>
        </div>`;
    }

    function setView(mode) {
      document.querySelectorAll('#content-layer > div').forEach(div => div.classList.add('hidden'));
      const active = document.getElementById(`view-${mode}`);
      if (active) active.classList.remove('hidden');
      
      // Reset preview if moving away from doc
      if (mode !== 'doc') {
        const previewEl = document.getElementById('doc-preview');
        if (previewEl) {
          previewEl.textContent = '';
          previewEl.classList.add('hidden');
        }
      }
      currentMode = mode;
    }

    function updateTranscript(msg) {
      const { turn_id, role, text } = msg;
      const container = document.getElementById('transcript-container');
      let existing = turns.find(t => t.turn_id === turn_id);

      if (!existing) {
        const el = document.createElement('div');
        el.className = `turn active ${role}`;
        el.innerHTML = `<span class="role-label">${role === 'agent' ? 'Gemini Architect' : 'You'}</span><span class="content"></span>`;
        
        turns.forEach(t => {
          if (t.element.classList.contains('active')) { t.element.classList.replace('active', 'prev-1'); }
          else if (t.element.classList.contains('prev-1')) { t.element.classList.replace('prev-1', 'prev-2'); }
          else if (t.element.classList.contains('prev-2')) { t.element.classList.replace('prev-2', 'old'); }
        });

        container.appendChild(el);
        existing = { turn_id, role, element: el };
        turns.push(existing);
        if (turns.length > 5) turns.shift().element.remove();
      }
      existing.element.querySelector('.content').textContent = text;
    }

    function renderInlineSVG(base64) {
      try {
        console.log('[stage] Rendering inline SVG...');
        // Robust UTF-8 base64 decoding
        const binString = atob(base64);
        const bytes = new Uint8Array(binString.length);
        for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
        const svg = new TextDecoder().decode(bytes);
        
        const container = document.getElementById('diagram-container');
        container.innerHTML = svg;
        
        const svgEl = container.querySelector('svg');
        if (svgEl) {
          // Force responsiveness: Remove hardcoded width/height
          svgEl.removeAttribute('width');
          svgEl.removeAttribute('height');
          // Ensure it scales proportionally and centers
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          
          svgEl.style.opacity = '0';
          svgEl.style.transition = 'opacity 400ms ease-out';
          requestAnimationFrame(() => svgEl.style.opacity = '1');
          console.log('[stage] SVG injected successfully');
        } else {
          console.warn('[stage] No <svg> element found in payload');
        }
      } catch (e) {
        console.error('[stage] SVG render failed:', e);
      }
    }

    function connectStageWS() {
      if (!meetingId) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws/stage?meeting_id=${encodeURIComponent(meetingId)}&ticket=${encodeURIComponent(ticket)}`);
      
      ws.onopen = () => console.log('[stage] Caption broadcast connected');
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          console.log('[stage] WS message:', msg.type, msg.mode || '');
          if (msg.type === 'transcript') {
            updateTranscript(msg);
          } else if (msg.type === 'view_change') {
            if (msg.mode === 'diagram') {
              if (diagramId !== msg.diag_id) {
                console.log('[stage] New diagram session:', msg.diag_id);
                diagramId = msg.diag_id;
                knownVersion = 0;
                showDiagramPlaceholder();
              }
              if (msg.svg) {
                console.log('[stage] Received inline SVG, length:', msg.svg.length);
                renderInlineSVG(msg.svg);
                knownVersion = msg.version;
              }
            }
            setView(msg.mode);
            if (msg.mode === 'doc') {
              document.getElementById('doc-link').href = msg.url || '#';
              document.getElementById('doc-title').textContent = msg.label || 'Document Ready';
              const previewEl = document.getElementById('doc-preview');
              if (previewEl) {
                if (msg.htmlContent) {
                  previewEl.innerHTML = msg.htmlContent;
                  previewEl.classList.remove('hidden');
                } else if (msg.content) {
                  previewEl.textContent = msg.content;
                  previewEl.classList.remove('hidden');
                }
              }
            }
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(connectStageWS, 3000);
      ws.onerror = () => ws.close();
    }

    // Handle initial state from URL
    if (params.get('doc')) {
      setView('doc');
      document.getElementById('doc-link').href = params.get('doc');
      document.getElementById('doc-title').textContent = params.get('label') || 'Document Ready';
      const previewEl = document.getElementById('doc-preview');
      if (previewEl) {
        const htmlContent = params.get('htmlContent');
        const content = params.get('content');
        if (htmlContent) {
          previewEl.innerHTML = decodeURIComponent(htmlContent);
          previewEl.classList.remove('hidden');
        } else if (content) {
          previewEl.textContent = decodeURIComponent(content);
          previewEl.classList.remove('hidden');
        }
      }
    } else if (diagramId || params.get('mode') === 'diagram') {
      showDiagramPlaceholder();
      setView('diagram');
    }

    connectStageWS();

    (async () => {
      try {
        const session = await meet.addon.createAddonSession({ cloudProjectNumber: '649226456677' });
        const client = await session.createMainStageClient();
        
        client.on('frameToFrameMessage', (arg) => {
          try {
            const msg = JSON.parse(arg.payload);
            console.log('[stage] SDK message:', msg.type, msg.mode || '');
            if (msg.type === 'transcript') {
              updateTranscript(msg);
            } else if (msg.type === 'view_change') {
              if (msg.mode === 'diagram') {
                if (diagramId !== msg.diag_id) {
                  diagramId = msg.diag_id;
                  knownVersion = 0;
                  showDiagramPlaceholder();
                }
              }
              setView(msg.mode);
              if (msg.mode === 'doc') {
                document.getElementById('doc-link').href = msg.url || '#';
                document.getElementById('doc-title').textContent = msg.label || 'Document Ready';
                const previewEl = document.getElementById('doc-preview');
                if (previewEl) {
                  if (msg.htmlContent) {
                    previewEl.innerHTML = msg.htmlContent;
                    previewEl.classList.remove('hidden');
                  } else if (msg.content) {
                    previewEl.textContent = msg.content;
                    previewEl.classList.remove('hidden');
                  }
                }
              } else if (msg.mode === 'diagram') {
                if (msg.svg) {
                  renderInlineSVG(msg.svg);
                  knownVersion = msg.version;
                }
              }
            }
          } catch (e) {}
        });
      } catch (e) { console.warn('Meet SDK init failed:', e); }
    })();
  </script>
</body>
</html>
