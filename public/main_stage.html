<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Ready</title>
  <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', sans-serif;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 500; margin-bottom: 10px; }
    p { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #1557b0; }
    .label {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📄</div>
    <h1 id="title">Document Ready</h1>
    <p>Your Workspace Concierge has created a new document for this meeting.</p>
    <a id="link" href="#" target="_blank" class="btn">Open Document</a>
    <div class="label" id="url-label"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const docUrl = params.get('doc') || '';
    const label = params.get('label') || 'New Document';

    document.getElementById('title').textContent = label;
    const link = document.getElementById('link');
    link.href = docUrl;
    link.textContent = 'Open ' + label;
    document.getElementById('url-label').textContent = docUrl;

    (async () => {
      try {
        const session = await meet.addon.createAddonSession({ cloudProjectNumber: '649226456677' });
        await session.createMainStageClient();
      } catch (e) { console.warn('Meet SDK init:', e); }
    })();
  </script>
</body>
</html>
