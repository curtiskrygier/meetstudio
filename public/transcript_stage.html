<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Transcript Stage</title>
  <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
  <style>
    :root {
      --active-font-size: 32px;
      --prev-font-size: 24px;
      --older-font-size: 18px;
      --transition-timing: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-duration: 400ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Google Sans', 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 60px; /* Leave space for Meet controls */
      background: transparent;
    }

    #transcript-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 1000px;
      gap: 16px;
    }

    .turn {
      padding: 12px 24px;
      border-radius: 20px;
      background: rgba(12, 13, 16, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all var(--transition-duration) var(--transition-timing);
      max-width: 100%;
      word-wrap: break-word;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }

    /* Active Turn (Bottom) */
    .turn.active {
      font-size: var(--active-font-size);
      font-weight: 500;
      opacity: 1;
      transform: translateY(0) scale(1);
      z-index: 10;
    }

    .turn.agent {
      border-color: rgba(155, 109, 255, 0.4);
      background: rgba(26, 21, 44, 0.7);
    }

    /* Bumping States */
    .turn.prev-1 {
      font-size: var(--prev-font-size);
      opacity: 0.6;
      transform: translateY(-10px) scale(0.85);
      z-index: 5;
    }

    .turn.prev-2 {
      font-size: var(--older-font-size);
      opacity: 0.3;
      transform: translateY(-20px) scale(0.75);
      z-index: 1;
    }

    .turn.old {
      opacity: 0;
      transform: translateY(-40px) scale(0.6);
      pointer-events: none;
    }

    .role-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      opacity: 0.5;
      display: block;
    }

    .agent .role-label {
      color: #c5a9ff;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="transcript-container">
    <!-- Turns injected here -->
  </div>

  <script>
    const container = document.getElementById('transcript-container');
    let turns = []; // Array of { turn_id, role, text, element }

    function updateTranscript(msg) {
      const { turn_id, role, text, is_final } = msg;
      
      let existing = turns.find(t => t.turn_id === turn_id);

      if (!existing) {
        // Create new turn element
        const el = document.createElement('div');
        el.className = `turn active ${role}`;
        el.id = `turn-${turn_id}`;
        el.innerHTML = `<span class="role-label">${role === 'agent' ? 'Gemini' : 'You'}</span><span class="content"></span>`;
        
        // Push current active down
        turns.forEach(t => {
          if (t.element.classList.contains('active')) {
            t.element.classList.remove('active');
            t.element.classList.add('prev-1');
          } else if (t.element.classList.contains('prev-1')) {
            t.element.classList.remove('prev-1');
            t.element.classList.add('prev-2');
          } else if (t.element.classList.contains('prev-2')) {
            t.element.classList.remove('prev-2');
            t.element.classList.add('old');
          }
        });

        // Add to DOM and tracking
        container.appendChild(el);
        existing = { turn_id, role, text: '', element: el };
        turns.push(existing);

        // Cleanup old elements
        if (turns.length > 5) {
          const removed = turns.shift();
          removed.element.remove();
        }
      }

      // Update content
      existing.text = text;
      existing.element.querySelector('.content').textContent = text;
    }

    (async () => {
      try {
        const session = await meet.addon.createAddonSession({ 
          cloudProjectNumber: '649226456677' 
        });
        const client = await session.createMainStageClient();
        
        client.on('frameToFrameMessage', (arg) => {
          try {
            const msg = JSON.parse(arg.payload);
            if (msg.type === 'transcript') {
              updateTranscript(msg);
            }
          } catch (e) {
            console.error('Failed to parse message:', e);
          }
        });
        
        console.log('Transcript Stage initialized');
      } catch (e) {
        console.warn('Meet SDK init failed:', e);
      }
    })();
  </script>
</body>
</html>
