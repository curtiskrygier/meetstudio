      quotes:
        source: stooq
        refresh: 5s
        fallback: []
    next_action:
      text:  "Wrap"
      fires: close

  # ─── 3. Closing Title slate ──────────────────────────────────────────
  - id: close
    template: title
    badge:    { text: "REALTIME MARKET DEMO", type: danger, pulse: true }
    title:    "LIVE MARKET SCAN"
    subtitle: "100 symbols · Refreshing every five seconds"
