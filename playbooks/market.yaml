name: market

slides:

  # ─── 1. High-Impact Intro — opener ────────────────────────────────────
  - id: intro
    template: signoff
    lines:
      - { text: "REAL DATA.",  color: white }
      - { text: "REAL TIME.",  color: phosphor }
      - { text: "ON STAGE.",   color: cyan }
    brands:
      left:  "STOOQ API"
      right: "YOUR DECK"
    badge_text: "STOOQ CSV SOURCE · MULTI-ASSET · TICK-REFRESHED"
    chef_line:  "THE KITCHEN POURS A LIVE GLASS."
    chef_sub:   "every five seconds."
    tagline:    "alive on stage."
    next_action:
      text:  "Show Me"
      fires: pulse

  # ─── 2. Live market ticker — flagship test of stooq + market_ticker ──
  - id: pulse
    template: market_ticker
    badge:   { text: "REALTIME · GLOBAL MARKETS", type: danger, pulse: true }
    # 98 diverse indices, equities, currencies, digital assets, and commodities.
    symbols: [
      ^SPX, ^DJI, ^NDX, ^RUT, ^FTSE, ^N225, ^GDAXI, ^FCHI,
      AAPL.US, MSFT.US, GOOGL.US, AMZN.US, NVDA.US, META.US, TSLA.US, NFLX.US, AVGO.US, AMD.US, INTC.US, QCOM.US, CSCO.US, ADBE.US, CRM.US, ORCL.US, BABA.US, TSM.US, ASML.US,
      JPM.US, BAC.US, MS.US, GS.US, V.US, MA.US,
      WMT.US, KO.US, PEP.US, PG.US, COST.US, DIS.US, NKE.US, SBUX.US, MCD.US, CAT.US, GE.US, BA.US, HON.US, MMM.US,
      XOM.US, CVX.US, COP.US, SLB.US, BP.US, SHEL.US, LIN.US, FCX.US,
      LLY.US, UNH.US, JNJ.US, MRK.US, ABBV.US, ABT.US, PFE.US, TMO.US, BMY.US,
      F.US, GM.US, TM.US, HMC.US, UBER.US, LYFT.US,
      GC.F, CL.F, SI.F, NG.F, ZC.F, CC.F, KC.F, CT.F,
      EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD, EURGBP, EURJPY, GBPJPY,
      BTCUSD, ETHUSD, SOLUSD, XRPUSD, ADAUSD, DOGEUSD, DOTUSD, LINKUSD, AVAXUSD, MATICUSD, LTCUSD, UNIUSD
