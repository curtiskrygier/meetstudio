<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MeetStudio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: #00F2FF;
    }

    #loading .logo {
      width: 48px;
      height: 48px;
      background: #00F2FF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #0a0a0a;
      letter-spacing: -0.02em;
    }

    #loading h2 {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #00F2FF;
    }

    #loading p {
      font-size: 11px;
      color: rgba(0,242,255,0.5);
      letter-spacing: 0.04em;
    }

    #loading .room-tag {
      font-size: 11px;
      color: rgba(0,242,255,0.8);
      background: rgba(0,242,255,0.08);
      border: 1px solid rgba(0,242,255,0.25);
      border-radius: 4px;
      padding: 4px 10px;
      letter-spacing: 0.06em;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #frame-container {
      display: none;
      position: absolute;
      inset: 0;
    }

    iframe {
      width: 100%;
      height: calc(100% - 32px);
      border: none;
    }

    #toolbar {
      height: 32px;
      background: #111;
      border-bottom: 1px solid rgba(0,242,255,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
    }

    #toolbar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00F2FF;
      opacity: 0.8;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #toolbar.stage-mode .dot { background: #ff6b35; }

    #toolbar .room-label {
      font-size: 10px;
      color: rgba(0,242,255,0.6);
      letter-spacing: 0.06em;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #stage-toggle {
      background: none;
      border: 1px solid rgba(0,242,255,0.25);
      color: rgba(0,242,255,0.55);
      font-family: 'Courier New', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      line-height: 1.4;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #stage-toggle:hover {
      color: #00F2FF;
      border-color: rgba(0,242,255,0.6);
      background: rgba(0,242,255,0.08);
    }
    #stage-toggle.active {
      color: #ff6b35;
      border-color: rgba(255,107,53,0.5);
      background: rgba(255,107,53,0.08);
    }
    #stage-toggle.active:hover { background: rgba(255,107,53,0.14); }
    #stage-toggle.loading { opacity: 0.4; cursor: default; pointer-events: none; }

    #settings-btn {
      background: none;
      border: none;
      color: rgba(0,242,255,0.4);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
      transition: color 0.15s;
    }
    #settings-btn:hover { color: #00F2FF; }

    #settings-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      padding: 24px;
      flex-direction: column;
      gap: 16px;
    }
    #settings-panel.visible { display: flex; }

    #settings-panel h3 {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #00F2FF;
    }

    #settings-panel label {
      font-size: 11px;
      color: rgba(0,242,255,0.6);
      letter-spacing: 0.04em;
    }

    #settings-panel input {
      width: 100%;
      background: #111;
      border: 1px solid rgba(0,242,255,0.3);
      border-radius: 4px;
      color: #00F2FF;
      font-family: monospace;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
    }
    #settings-panel input:focus { border-color: #00F2FF; }

    .btn {
      padding: 8px 16px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1px solid #00F2FF;
      background: rgba(0,242,255,0.12);
      color: #00F2FF;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(0,242,255,0.22); }
    .btn.ghost { background: none; color: rgba(0,242,255,0.5); border-color: rgba(0,242,255,0.25); }
    .btn.ghost:hover { background: rgba(0,242,255,0.06); }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">MS</div>
    <h2>MEETSTUDIO</h2>
    <p id="loading-status">detecting meeting context…</p>
    <div id="room-tag" class="room-tag" style="display:none"></div>
  </div>

  <div id="frame-container">
    <div id="toolbar">
      <div class="dot"></div>
      <div class="room-label" id="toolbar-label">meetstudio</div>
      <button id="stage-toggle" title="Switch to Stage view">▶ STAGE</button>
      <button id="settings-btn" title="Settings">⚙</button>
    </div>
    <iframe
      id="ms-frame"
      allow="microphone; camera; display-capture; autoplay; clipboard-write"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
    ></iframe>
  </div>

  <div id="settings-panel">
    <h3>SETTINGS</h3>
    <div>
      <label>MeetStudio URL</label>
      <input id="url-input" type="url" placeholder="http://localhost:8085">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="save-btn">Save & Reload</button>
      <button class="btn ghost" id="cancel-btn">Cancel</button>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
